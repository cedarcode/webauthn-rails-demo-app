version: 2
updates:
  - package-ecosystem: "bundler"
    directory: "/"
    schedule:
      interval: "weekly"
    ignore:
      - dependency-name: "rails"
        update-types:
          - "version-update:semver-major"
          - "version-update:semver-minor"
    groups:
      all-gems:
        patterns:
          - "*"
        exclude-patterns:
          - "rails"
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
